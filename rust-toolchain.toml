# One pinned nightly (chosen at setup, 2026-11-17: rustc 1.102.0-nightly 5f4effd57 2026-11-13).
# Nightly is needed for -Z build-std on the user-space target.
[toolchain]
channel = "nightly-2026-11-15"
components = ["rust-src", "llvm-tools", "clippy", "rustfmt"]
targets = ["x86_64-unknown-uefi", "x86_64-unknown-none"]
profile = "minimal"
