# SPDX-License-Identifier: Apache-2.0
[package]
name = "app-terminal"
description = "Freally Terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"

[features]
flavour-release = []
flavour-dev = []
flavour-e2e = []

[dependencies]
app-shell = { path = "../shell" }
fcore-abi.workspace = true
ffont = { workspace = true, features = ["raster"] }
fstd.workspace = true
fui = { workspace = true, features = ["ui"] }
fwire.workspace = true

[lints]
workspace = true
