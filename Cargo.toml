# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = [
    "xtask",
    "boot",
    "kernel",
    "lib/*",
    "services/*",
    "drivers/*",
    "apps/*",
    "tools/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# ONLY in-repo crates, ever (the no-third-party gate reads Cargo.lock).
# Each joins this list when a crate first depends on it.
[workspace.dependencies]
fcore-abi = { path = "lib/fcore-abi" }
fcrypto = { path = "lib/fcrypto" }
fsi = { path = "lib/fsi" }
ffont = { path = "lib/ffont" }
fscreen = { path = "lib/fscreen" }
fimage = { path = "lib/fimage" }
fjson = { path = "lib/fjson" }
facpi = { path = "lib/facpi" }
felf = { path = "lib/felf" }
finput = { path = "lib/finput" }
fsvc = { path = "lib/fsvc" }
frt = { path = "lib/frt" }
fstd = { path = "lib/fstd" }
fwire = { path = "lib/fwire" }
cdp-proto = { path = "tools/cdp-proto" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.dev.package.fcrypto]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1
incremental = false
