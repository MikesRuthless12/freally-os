# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = [
    "xtask",
    "boot",
    "kernel",
    "lib/*",
    "services/*",
    "drivers/*",
    "apps/*",
    "tools/*",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

# ONLY in-repo crates, ever (the no-third-party gate reads Cargo.lock).
# Each joins this list when a crate first depends on it.
[workspace.dependencies]
fcore-abi = { path = "lib/fcore-abi" }
fcrypto = { path = "lib/fcrypto" }
fbootctl = { path = "lib/fbootctl" }
fgpt = { path = "lib/fgpt" }
fsi = { path = "lib/fsi" }
ffont = { path = "lib/ffont" }
frandom = { path = "lib/frandom" }
fscreen = { path = "lib/fscreen" }
fui = { path = "lib/fui" }
fimage = { path = "lib/fimage" }
fjson = { path = "lib/fjson" }
facpi = { path = "lib/facpi" }
fedid = { path = "lib/fedid" }
felf = { path = "lib/felf" }
finput = { path = "lib/finput" }
fsvc = { path = "lib/fsvc" }
frt = { path = "lib/frt" }
fstd = { path = "lib/fstd" }
fapp = { path = "lib/fapp" }
fdecimal = { path = "lib/fdecimal" }
fwire = { path = "lib/fwire" }
drv-virtio-net = { path = "drivers/virtio-net" }
drv-e1000 = { path = "drivers/e1000" }
fnet = { path = "lib/fnet" }
fnetdev = { path = "lib/fnetdev" }
fhttp = { path = "lib/fhttp" }
fhttps = { path = "lib/fhttps" }
ftls = { path = "lib/ftls" }
cdp-proto = { path = "tools/cdp-proto" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.dev.package.fcrypto]
opt-level = 3

# xtask decodes the playbook's PNGs and scales them (cargo xtask assets).
[profile.dev.package.fimage]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1
incremental = false
