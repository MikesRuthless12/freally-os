[package]
name = "fcrypto"
description = "Freally's own cryptography: SHA-256/512, SHA-1 (WebSocket handshake only), Ed25519, CRC32C and constant-time helpers."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# SHA-256 with the x86 SHA extensions when the CPU has them (TASK-076): the
# bootloader turns it on; the kernel's soft-float build never does.
shani = []
