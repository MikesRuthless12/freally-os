# SPDX-License-Identifier: Apache-2.0
[package]
name = "svc-stage"
description = "stage: the compositor, windows, input and the fleet cursor."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stage"
path = "src/main.rs"

[features]
flavour-release = []
flavour-dev = []
# The e2e door's read-backs (`list_windows`, `pointer`).
flavour-e2e = []

[dependencies]
fcore-abi.workspace = true
ffont = { workspace = true, features = ["raster"] }
fedid.workspace = true
fimage.workspace = true
fstd.workspace = true
fui = { workspace = true, features = ["ui"] }
fwire.workspace = true

[lints]
workspace = true
