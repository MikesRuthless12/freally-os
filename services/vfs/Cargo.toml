# SPDX-License-Identifier: Apache-2.0
[package]
name = "svc-vfs"
description = "vfs: one namespace for every process; /system read-only, each home its account's alone."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vfs"
path = "src/main.rs"

[features]
flavour-release = []
flavour-dev = []
# conductor's test door may set the session (`vfs session <user>`).
flavour-e2e = []

[dependencies]
fcore-abi.workspace = true
fcrypto.workspace = true
fstd.workspace = true
fwire.workspace = true

[lints]
workspace = true
