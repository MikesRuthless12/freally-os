# SPDX-License-Identifier: Apache-2.0
[package]
name = "svc-conductor"
description = "conductor, PID 1: starts every service from its manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "conductor"
path = "src/main.rs"

[features]
# Exactly one, chosen by `cargo xtask build` for the image's flavour.
flavour-release = []
flavour-dev = []
# The test door on COM3 (`door.rs`): compiled into e2e images only.
flavour-e2e = []

[dependencies]
fbootctl.workspace = true
fcore-abi.workspace = true
fcrypto.workspace = true
felf.workspace = true
fsi.workspace = true
fstd.workspace = true
fsvc.workspace = true
fwire.workspace = true

[lints]
workspace = true
