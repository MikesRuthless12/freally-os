# SPDX-License-Identifier: Apache-2.0
[package]
name = "svc-desktop"
description = "desktop: the wallpaper, the Rack and the launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[features]
flavour-release = []
flavour-dev = []
flavour-e2e = []
# `cargo xtask brain-swap desktop --crash`: a build that ends a second after it
# starts, to prove a swap's automatic rollback (TASK-083). Never in an image.
swap-crash-test = []

[dependencies]
fcore-abi.workspace = true
ffont = { workspace = true, features = ["raster"] }
fimage.workspace = true
fstd.workspace = true
fui = { workspace = true, features = ["ui"] }
fwire.workspace = true

[dev-dependencies]
fimage = { workspace = true, features = ["decode"] }

[lints]
workspace = true
