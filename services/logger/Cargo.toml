[package]
name = "svc-logger"
description = "logger: the system log ring."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "logger"
path = "src/main.rs"

[features]
flavour-release = []
# log=screen (TASK-074) draws with fscreen, in dev images only.
flavour-dev = ["dep:fscreen"]
flavour-e2e = []

[dependencies]
fcore-abi.workspace = true
fstd.workspace = true
fwire.workspace = true
fscreen = { workspace = true, optional = true }

[lints]
workspace = true
